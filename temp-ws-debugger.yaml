apiVersion: v1
kind: Pod
metadata:
  name: workspace-inspector
  namespace: sovereign-agent-smoke
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: inspector
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 86400"]
      stdin: true
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: agent-runtime-smoke-workspace 
        readOnly: true
