---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sovereignworkflows.aim.sovereign.io
spec:
  group: aim.sovereign.io
  names:
    kind: SovereignWorkflow
    listKind: SovereignWorkflowList
    plural: sovereignworkflows
    singular: sovereignworkflow
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SovereignWorkflow is the Schema for the Sovereign workflows API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SovereignWorkflowSpec defines the desired state (The user's
              intent)
            properties:
              classification:
                type: string
              definitionRevision:
                type: string
              projectRef:
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
              requestedVolumeSize:
                type: string
              steps:
                items:
                  description: StepConfig declares one workflow stage and exactly
                    one domain execution primitive.
                  properties:
                    agent:
                      description: |-
                        AgentStepSpec declares delegated autonomous work. These fields are never
                        copied into deterministic utility, approval, or validation primitives.
                      properties:
                        capabilities:
                          items:
                            type: string
                          type: array
                        deterministic:
                          type: boolean
                        executable:
                          items:
                            type: string
                          type: array
                        image:
                          type: string
                        inference:
                          properties:
                            estimatedKVRAMMiB:
                              format: int64
                              type: integer
                            evictable:
                              type: boolean
                            model:
                              type: string
                            modelRevision:
                              type: string
                            priority:
                              format: int32
                              type: integer
                            sharingScope:
                              type: string
                          required:
                          - estimatedKVRAMMiB
                          - model
                          - modelRevision
                          - sharingScope
                          type: object
                        responsibility:
                          type: string
                      required:
                      - executable
                      - image
                      - responsibility
                      type: object
                    approval:
                      properties:
                        denyBehavior:
                          type: string
                        mode:
                          type: string
                        requiredGroups:
                          items:
                            type: string
                          type: array
                      required:
                      - denyBehavior
                      - mode
                      - requiredGroups
                      type: object
                    inputs:
                      items:
                        properties:
                          digest:
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    kind:
                      type: string
                    maxAttempts:
                      format: int32
                      type: integer
                    name:
                      type: string
                    order:
                      type: integer
                    outputs:
                      items:
                        properties:
                          name:
                            type: string
                          version:
                            type: string
                        required:
                        - name
                        - version
                        type: object
                      type: array
                    timeout:
                      type: string
                    utility:
                      description: |-
                        UtilityOperationRequest declares one platform-owned deterministic operation.
                        Parameters are interpreted by the named allow-listed operation; they are not
                        an arbitrary process command. The controller derives the idempotency key and
                        resolves Project-owned commands and credentials before scheduling a Job.
                      properties:
                        name:
                          enum:
                          - repository.initialize
                          - git.createBranch
                          - candidate.prepare
                          - git.commit
                          - git.push
                          - git.merge
                          - test.run
                          - build.image
                          type: string
                        parameters:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                      - name
                      type: object
                    validation:
                      description: |-
                        ValidationStepSpec declares the subject and provider contract for a
                        validation authority. Empty provider-specific values are resolved from the
                        owning Project by the ValidationRun controller.
                      properties:
                        commit:
                          type: string
                        destination:
                          type: string
                        imageDigest:
                          type: string
                        overlayPath:
                          type: string
                        provider:
                          type: string
                      required:
                      - provider
                      type: object
                  required:
                  - kind
                  - name
                  - order
                  type: object
                  x-kubernetes-validations:
                  - message: agent is required for Agent steps
                    rule: self.kind != 'Agent' || has(self.agent)
                  - message: agent is only allowed for Agent steps
                    rule: self.kind == 'Agent' || !has(self.agent)
                  - message: approval is required for HumanGate steps
                    rule: self.kind != 'HumanGate' || has(self.approval)
                  - message: approval is only allowed for HumanGate steps
                    rule: self.kind == 'HumanGate' || !has(self.approval)
                  - message: utility is required for Utility steps
                    rule: self.kind != 'Utility' || has(self.utility)
                  - message: utility is only allowed for Utility steps
                    rule: self.kind == 'Utility' || !has(self.utility)
                  - message: validation is required for Validation steps
                    rule: self.kind != 'Validation' || has(self.validation)
                  - message: validation is only allowed for Validation steps
                    rule: self.kind == 'Validation' || !has(self.validation)
                type: array
              workflowId:
                type: string
            required:
            - projectRef
            - requestedVolumeSize
            - steps
            - workflowId
            type: object
          status:
            description: SovereignWorkflowStatus defines the observed state
            properties:
              activeAttemptRef:
                type: string
              activeStep:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              pvcName:
                type: string
              workspaceWriterLeaseRef:
                type: string
            required:
            - phase
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
