---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sovereignworkflows.aim.sovereign.io
spec:
  group: aim.sovereign.io
  names:
    kind: SovereignWorkflow
    listKind: SovereignWorkflowList
    plural: sovereignworkflows
    singular: sovereignworkflow
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SovereignWorkflow is the Schema for the Sovereign workflows API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SovereignWorkflowSpec defines the desired state (The user's
              intent)
            properties:
              bootstrap:
                description: |-
                  WorkflowBootstrapSpec identifies the immutable ingress object whose exact
                  bytes must become the first accepted workflow Artifact.
                properties:
                  artifactName:
                    type: string
                  contract:
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  expectedDigest:
                    type: string
                  key:
                    type: string
                  sourceRef:
                    properties:
                      name:
                        type: string
                      uid:
                        description: |-
                          UID is a type that holds unique ID values, including UUIDs.  Because we
                          don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                          intent and helps make sure that UIDs and names do not get conflated.
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                required:
                - artifactName
                - contract
                - expectedDigest
                - key
                - sourceRef
                type: object
                x-kubernetes-validations:
                - message: bootstrap is immutable
                  rule: self == oldSelf
              classification:
                type: string
              definitionRevision:
                type: string
              maxWorkflowAttempt:
                description: MaxWorkflowAttempt bounds application-level test failure
                  rewinds independently of infrastructure retries.
                format: int32
                minimum: 1
                type: integer
              projectRef:
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
              requestedVolumeSize:
                type: string
              requesterSubject:
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: requesterSubject is immutable
                  rule: self == oldSelf
              steps:
                items:
                  description: StepConfig declares one workflow stage and exactly
                    one domain execution primitive.
                  properties:
                    agent:
                      description: |-
                        AgentStepSpec declares delegated autonomous work. These fields are never
                        copied into deterministic utility, approval, or validation primitives.
                      properties:
                        capabilities:
                          items:
                            type: string
                          type: array
                        deterministic:
                          type: boolean
                        executable:
                          items:
                            type: string
                          type: array
                        image:
                          type: string
                        inference:
                          properties:
                            estimatedKVRAMMiB:
                              format: int64
                              type: integer
                            evictable:
                              type: boolean
                            model:
                              type: string
                            modelRevision:
                              type: string
                            priority:
                              format: int32
                              type: integer
                            sharingScope:
                              type: string
                          required:
                          - estimatedKVRAMMiB
                          - model
                          - modelRevision
                          - sharingScope
                          type: object
                        responsibility:
                          type: string
                      required:
                      - executable
                      - image
                      - responsibility
                      type: object
                    approval:
                      properties:
                        denyBehavior:
                          type: string
                        mode:
                          type: string
                        requiredGroups:
                          items:
                            type: string
                          type: array
                      required:
                      - denyBehavior
                      - mode
                      - requiredGroups
                      type: object
                    inputs:
                      items:
                        properties:
                          artifactRef:
                            properties:
                              name:
                                type: string
                              uid:
                                description: |-
                                  UID is a type that holds unique ID values, including UUIDs.  Because we
                                  don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                  intent and helps make sure that UIDs and names do not get conflated.
                                type: string
                            required:
                            - name
                            - uid
                            type: object
                          digest:
                            type: string
                          name:
                            type: string
                          producerAttemptRef:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    kind:
                      type: string
                    maxAttempts:
                      format: int32
                      type: integer
                    name:
                      type: string
                    order:
                      type: integer
                    outputs:
                      items:
                        properties:
                          name:
                            type: string
                          version:
                            type: string
                        required:
                        - name
                        - version
                        type: object
                      type: array
                    requiresApproval:
                      description: ApprovalRequirement names the earlier human gate
                        and shared artifact input.
                      properties:
                        step:
                          type: string
                        subject:
                          type: string
                      required:
                      - step
                      - subject
                      type: object
                    timeout:
                      type: string
                    utility:
                      description: |-
                        UtilityOperationRequest declares one platform-owned deterministic operation.
                        Parameters are interpreted by the named allow-listed operation; they are not
                        an arbitrary process command. The controller derives the idempotency key and
                        resolves Project-owned commands and credentials before scheduling a Job.
                      properties:
                        name:
                          enum:
                          - repository.initialize
                          - git.createBranch
                          - candidate.prepare
                          - git.commit
                          - git.push
                          - git.merge
                          - git.mergeRequest
                          - test.run
                          - build.image
                          type: string
                        parameters:
                          additionalProperties:
                            type: string
                          type: object
                      required:
                      - name
                      type: object
                    validation:
                      description: |-
                        ValidationStepSpec declares the subject and provider contract for a
                        validation authority. Empty provider-specific values are resolved from the
                        owning Project by the ValidationRun controller.
                      properties:
                        commit:
                          type: string
                        destination:
                          type: string
                        imageDigest:
                          type: string
                        overlayPath:
                          type: string
                        provider:
                          type: string
                      required:
                      - provider
                      type: object
                  required:
                  - kind
                  - name
                  - order
                  type: object
                  x-kubernetes-validations:
                  - message: agent is required for Agent steps
                    rule: self.kind != 'Agent' || has(self.agent)
                  - message: agent is only allowed for Agent steps
                    rule: self.kind == 'Agent' || !has(self.agent)
                  - message: approval is required for HumanGate steps
                    rule: self.kind != 'HumanGate' || has(self.approval)
                  - message: approval is only allowed for HumanGate steps
                    rule: self.kind == 'HumanGate' || !has(self.approval)
                  - message: utility is required for Utility steps
                    rule: self.kind != 'Utility' || has(self.utility)
                  - message: utility is only allowed for Utility steps
                    rule: self.kind == 'Utility' || !has(self.utility)
                  - message: validation is required for Validation steps
                    rule: self.kind != 'Validation' || has(self.validation)
                  - message: validation is only allowed for Validation steps
                    rule: self.kind == 'Validation' || !has(self.validation)
                type: array
              workflowId:
                type: string
            required:
            - bootstrap
            - projectRef
            - requestedVolumeSize
            - requesterSubject
            - steps
            - workflowId
            type: object
          status:
            description: SovereignWorkflowStatus defines the observed state
            properties:
              activeAttemptRef:
                type: string
              activeStep:
                type: string
              bootstrapArtifactRef:
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
              bootstrapJobRef:
                type: string
              bootstrapWriterEpoch:
                format: int32
                type: integer
              bootstrapWriterReleased:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              pvcName:
                type: string
              refinement:
                description: |-
                  WorkflowRefinementStatus records an application-level test failure that
                  rewound the workflow. It is distinct from infrastructure retry state.
                properties:
                  agentCompletions:
                    items:
                      properties:
                        attemptRef:
                          type: string
                        completion:
                          description: |-
                            AgentCompletionStatus is the controller-observed durable terminal action
                            produced by agent_complete.
                          properties:
                            digest:
                              type: string
                            disposition:
                              enum:
                              - changed
                              - no_change
                              - contract_ambiguous
                              type: string
                            summary:
                              maxLength: 1024
                              minLength: 1
                              type: string
                          required:
                          - disposition
                          - summary
                          type: object
                        stepName:
                          type: string
                      required:
                      - attemptRef
                      - completion
                      - stepName
                      type: object
                    type: array
                  iteration:
                    format: int32
                    type: integer
                  recovery:
                    description: |-
                      WorkflowRecoveryEvidence freezes the decision's inputs before the workflow
                      advances, allowing audit writes to be retried without inventing new evidence.
                    properties:
                      evidenceEvents:
                        items:
                          type: string
                        type: array
                      failureReason:
                        type: string
                      feedback:
                        properties:
                          code:
                            pattern: ^[A-Za-z][A-Za-z0-9]{0,127}$
                            type: string
                          message:
                            maxLength: 1024
                            minLength: 1
                            type: string
                          previousAttemptRef:
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - code
                        - message
                        - previousAttemptRef
                        type: object
                      fromWorkflowAttempt:
                        format: int32
                        type: integer
                      inputLinks:
                        items:
                          description: |-
                            RecoveryInputLink proves a consumed artifact's producing attempt. All refs
                            name immutable objects; these are not timestamp-based ancestry guesses.
                          properties:
                            consumer:
                              properties:
                                name:
                                  type: string
                                uid:
                                  description: |-
                                    UID is a type that holds unique ID values, including UUIDs.  Because we
                                    don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                    intent and helps make sure that UIDs and names do not get conflated.
                                  type: string
                              required:
                              - name
                              - uid
                              type: object
                            input:
                              properties:
                                artifactRef:
                                  properties:
                                    name:
                                      type: string
                                    uid:
                                      description: |-
                                        UID is a type that holds unique ID values, including UUIDs.  Because we
                                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                        intent and helps make sure that UIDs and names do not get conflated.
                                      type: string
                                  required:
                                  - name
                                  - uid
                                  type: object
                                digest:
                                  type: string
                                name:
                                  type: string
                                producerAttemptRef:
                                  type: string
                              required:
                              - name
                              type: object
                            producer:
                              properties:
                                name:
                                  type: string
                                uid:
                                  description: |-
                                    UID is a type that holds unique ID values, including UUIDs.  Because we
                                    don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                    intent and helps make sure that UIDs and names do not get conflated.
                                  type: string
                              required:
                              - name
                              - uid
                              type: object
                          required:
                          - consumer
                          - input
                          - producer
                          type: object
                        type: array
                      maxWorkflowAttempt:
                        format: int32
                        type: integer
                      missing:
                        items:
                          type: string
                        type: array
                      previousAttempt:
                        properties:
                          name:
                            type: string
                          uid:
                            description: |-
                              UID is a type that holds unique ID values, including UUIDs.  Because we
                              don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                              intent and helps make sure that UIDs and names do not get conflated.
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                      previousOutcome:
                        type: string
                      reports:
                        items:
                          properties:
                            artifactRef:
                              properties:
                                name:
                                  type: string
                                uid:
                                  description: |-
                                    UID is a type that holds unique ID values, including UUIDs.  Because we
                                    don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                    intent and helps make sure that UIDs and names do not get conflated.
                                  type: string
                              required:
                              - name
                              - uid
                              type: object
                            digest:
                              type: string
                            name:
                              type: string
                            producerAttemptRef:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      selectedAt:
                        format: date-time
                        type: string
                      triggerAttempt:
                        properties:
                          name:
                            type: string
                          uid:
                            description: |-
                              UID is a type that holds unique ID values, including UUIDs.  Because we
                              don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                              intent and helps make sure that UIDs and names do not get conflated.
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                    required:
                    - failureReason
                    - fromWorkflowAttempt
                    - maxWorkflowAttempt
                    - selectedAt
                    - triggerAttempt
                    type: object
                  restartStep:
                    type: string
                  retryObservation:
                    description: |-
                      WorkflowRetryObservation freezes when the controller verified the persisted
                      replacement, separately from the earlier immutable recovery decision.
                    properties:
                      attempt:
                        properties:
                          name:
                            type: string
                          uid:
                            description: |-
                              UID is a type that holds unique ID values, including UUIDs.  Because we
                              don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                              intent and helps make sure that UIDs and names do not get conflated.
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                      decisionEvent:
                        type: string
                      execution:
                        properties:
                          name:
                            type: string
                          uid:
                            description: |-
                              UID is a type that holds unique ID values, including UUIDs.  Because we
                              don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                              intent and helps make sure that UIDs and names do not get conflated.
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                      observedAt:
                        format: date-time
                        type: string
                    required:
                    - attempt
                    - decisionEvent
                    - execution
                    - observedAt
                    type: object
                  testReport:
                    description: |-
                      SelectedArtifact records the exact accepted artifact identity used for
                      subsequent workflow inputs. ProducerAttemptRef is empty for bootstrap
                      artifacts produced directly by the workflow.
                    properties:
                      contract:
                        properties:
                          name:
                            type: string
                          version:
                            type: string
                        required:
                        - name
                        - version
                        type: object
                      digest:
                        type: string
                      producerAttemptRef:
                        type: string
                    required:
                    - contract
                    - digest
                    type: object
                  triggerAttemptRef:
                    type: string
                  triggerStep:
                    type: string
                required:
                - iteration
                - restartStep
                - triggerAttemptRef
                - triggerStep
                type: object
              selectedArtifacts:
                items:
                  description: |-
                    SelectedArtifact records the exact accepted artifact identity used for
                    subsequent workflow inputs. ProducerAttemptRef is empty for bootstrap
                    artifacts produced directly by the workflow.
                  properties:
                    contract:
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                      required:
                      - name
                      - version
                      type: object
                    digest:
                      type: string
                    producerAttemptRef:
                      type: string
                  required:
                  - contract
                  - digest
                  type: object
                type: array
              workflowAttempt:
                format: int32
                type: integer
              workspaceWriterLeaseRef:
                type: string
            required:
            - phase
            - workflowAttempt
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
