apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  labels:
    app.kubernetes.io/name: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calculator
          image: registry.internal/sovereign/calculator:seed
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL