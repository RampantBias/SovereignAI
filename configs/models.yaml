# configs/models.yaml
models:
  - name: "llama-3-8b-q4"
    repo: "casperhansen/llama-3-8b-instruct-awq"
    # Static Weights: 5.5GB + 500MB system overhead
    # + 2GB KV Cache (allows ~2k tokens at FP16 or ~8k at INT4 KV)
    min_vram_mb: 8000 
    description: "Standard developer agent"

  - name: "llama-3-70b-q4"
    repo: "tech-backend/llama-3-70b-instruct-awq"
    # Weights: ~40GB + 8GB KV Cache pool
    min_vram_mb: 48000
    description: "Architect agent - high reasoning"

  - name: "phi-3-mini"
    repo: "microsoft/Phi-3-mini-4k-instruct"
    min_vram_mb: 3000
    description: "Linter/Utility agent"