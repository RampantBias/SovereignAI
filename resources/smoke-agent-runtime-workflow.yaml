apiVersion: aim.sovereign.io/v1alpha1
kind: SovereignWorkflow
metadata:
  name: agent-runtime-smoke
  namespace: __NAMESPACE__
  labels:
    sovereign-ai.io/project: __PROJECT_NAME__
    sovereign-ai.io/workflow-id: agent-runtime-smoke
spec:
  projectRef:
    name: __PROJECT_NAME__
    uid: __PROJECT_UID__
  workflowId: agent-runtime-smoke
  requesterSubject: smoke/runtime-proof
  bootstrap:
    sourceRef:
      name: agent-runtime-smoke-input
      uid: __SOURCE_UID__
    key: change-request.json
    expectedDigest: __EXPECTED_DIGEST__
    contract:
      name: change-request
      version: v1
    artifactName: change-request
  definitionRevision: agent-runtime-smoke-v1
  classification: internal
  requestedVolumeSize: 1Gi
  steps:
    - name: initialize-repository
      kind: Utility
      order: 1
      utility:
        name: repository.initialize
      inputs:
        - name: change-request
      outputs:
        - name: repository-revision
          version: v1
      timeout: 10m
      maxAttempts: 1
    - name: architect
      kind: Agent
      order: 2
      agent:
        responsibility: >
          Analyze the change request and checked-out repository and produce an
          implementation plan identifying affected files, changes, risks, and tests.
          List every planned file change in affectedPaths using the exact
          repository-relative path with / separators. Do not use a leading ./, an
          absolute path, or any empty, ., .., or .git path segment. Each affectedPaths
          path and action must correspond directly to an implementation step, and no
          unrelated file may be listed.
        image: sovereign-reference-agent:dev
        executable: ["/reference-agent"]
        capabilities: ["context.read", "artifact.publish"]
        inference:
          model: code-small
          modelRevision: "488639f1ff808d1d3d0ba301aef8c11461451ec5"
          estimatedKVRAMMiB: 2048
          sharingScope: SharedWithinWorkflow
      inputs:
        - name: change-request
        - name: repository-revision
      outputs:
        - name: implementation-plan
          version: v1
      timeout: 15m
      maxAttempts: 5
    - name: test-author
      kind: Agent
      order: 3
      agent:
        responsibility: >
          Use the change request, implementation plan, and repository to produce the
          smallest unified-diff test change set that verifies divide success, divide
          by zero, and preservation of the existing calculator behavior. Modify exactly
          one existing file: src/main_test.go. Never include src/main.go or any other
          path, and do not implement production behavior. Extend the existing tests;
          do not rewrite package declarations, production types, handlers, or the
          complete source file. Return a short summary and patchLines, an array
          containing exactly one physical Git unified-diff line per item with no
          embedded CR, LF, or NUL. The first three patchLines must be exactly
          `diff --git a/src/main_test.go b/src/main_test.go`,
          `--- a/src/main_test.go`, and `+++ b/src/main_test.go`. Follow them with one
          or more valid @@ hunks and exact context and changed lines from the repository.
          Use exact repository paths and contents and include at least one added or
          deleted line. Do not use timestamps, Markdown fences, placeholders, ellipses,
          prose, invented metadata, or production paths in patchLines. Before responding,
          verify every diff header names only src/main_test.go and every changed line is
          test code.
        image: sovereign-reference-agent:dev
        executable: ["/reference-agent"]
        capabilities: ["context.read", "artifact.publish"]
        inference:
          model: code-small
          modelRevision: "488639f1ff808d1d3d0ba301aef8c11461451ec5"
          estimatedKVRAMMiB: 2048
          sharingScope: SharedWithinWorkflow
      inputs:
        - name: change-request
        - name: implementation-plan
        - name: repository-revision
      outputs:
        - name: test-change-set
          version: v1
      timeout: 15m
      maxAttempts: 5
    - name: developer
      kind: Agent
      order: 4
      agent:
        responsibility: >
          Use the change request, implementation plan, proposed tests, and repository
          to produce the smallest unified-diff production change set that implements
          divide success and the division-by-zero response while preserving existing
          calculator behavior. Modify exactly one existing file: src/main.go. Never
          include src/main_test.go or any other path. Treat the accepted test change set
          as read-only requirements; never repeat or modify its patchLines. Extend the
          existing operation constants and calculation handler without rewriting the
          package declaration, imports, unrelated handlers, or the complete source file.
          Return a short summary and patchLines, an array containing exactly one physical
          Git unified-diff line per item with no embedded CR, LF, or NUL. The first three
          patchLines must be exactly `diff --git a/src/main.go b/src/main.go`,
          `--- a/src/main.go`, and `+++ b/src/main.go`. Follow them with the smallest
          valid @@ hunks and exact context and changed lines from the repository. Use
          exact repository paths and contents and include at least one added or deleted
          line. Do not use timestamps, Markdown fences, placeholders, ellipses, prose,
          invented metadata, test paths, or unchanged full-file content in patchLines.
          Before responding, verify every diff header names only src/main.go and every
          changed line is required production code.
        image: sovereign-reference-agent:dev
        executable: ["/reference-agent"]
        capabilities: ["context.read", "artifact.publish"]
        inference:
          model: code-small
          modelRevision: "488639f1ff808d1d3d0ba301aef8c11461451ec5"
          estimatedKVRAMMiB: 2048
          sharingScope: SharedWithinWorkflow
      inputs:
        - name: change-request
        - name: implementation-plan
        - name: repository-revision
        - name: test-change-set
      outputs:
        - name: change-set
          version: v1
      timeout: 15m
      maxAttempts: 5
