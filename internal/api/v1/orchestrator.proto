syntax = "proto3";

package api.v1;
option go_package = "api/v1/pb";

// Define the network service endpoints
service OrchestratorService {
  rpc CreateProject (CreateProjectRequest) returns (CreateProjectResponse);
  rpc CleanWorkflow (CleanWorkflowRequest) returns (CleanWorkflowResponse);
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc GetWorkflowTimeline (GetWorkflowTimelineRequest) returns (GetWorkflowTimelineResponse);
  rpc StoreContextSnapshot (StoreContextSnapshotRequest) returns (ContextSnapshotReceipt);
  rpc GetContextSnapshot (GetContextSnapshotRequest) returns (GetContextSnapshotResponse);
  rpc GetWorkflowLineage (GetWorkflowLineageRequest) returns (GetWorkflowLineageResponse);
  rpc SubmitApproval (ApprovalSubmission) returns (ApprovalResponse);
}

message CreateProjectRequest {
  string project_name = 1;
  string infra_repo = 2;
  string app_repo = 3;
  
  // The open extension point for enterprise variations
  string strategy_type = 4;                 // e.g., "single-repo", "enterprise-cluster"
  map<string, string> extended_metadata = 5; // e.g., {"terraform_repo": "git://...", "shared_charts": "true"}
}

message CreateProjectResponse {
  bool success = 1;
  string message = 2;
}


message CleanWorkflowRequest {
  string workflow_id = 1;
  string project_name = 2;
}

message CleanWorkflowResponse {
  bool success = 1;
  string message = 2;
}

// CreateWorkflow
message CreateWorkflowRequest {
    string project_name = 1;
    string manifest_content = 2;
    bytes change_request_content = 3;
}

message CreateWorkflowResponse {
    string workflow_id = 1;
}
//


message ListWorkflowsRequest {
  string project_name = 1;
}

// The clean Data Transfer Object definition
message WorkflowStatusDTO {
  string project_name = 1;
  string workflow_id = 2;
  string status = 3;
  string current_step = 4;
  string namespace = 5;
}

message ListWorkflowsResponse {
  repeated WorkflowStatusDTO workflows = 1; // 'repeated' represents an array/slice in Go
}

message GetWorkflowTimelineRequest {
  string workflow_id = 1;
}

message AuditActorDTO {
  string kind = 1;
  string id = 2;
}

message AuditSubjectDTO {
  string project = 1;
  string namespace = 2;
  string workflow = 3;
  string step = 4;
  int32 attempt = 5;
}

message AuditEventDTO {
  string id = 1;
  string type = 2;
  string schema_version = 3;
  string occurred_at = 4;
  string recorded_at = 5;
  AuditActorDTO actor = 6;
  AuditSubjectDTO subject = 7;
  string action = 8;
  string target = 9;
  string outcome = 10;
  string reason = 11;
  string correlation_id = 12;
  string causation_id = 13;
  string decision_id = 14;
  map<string, string> references = 15;
  string data_json = 16;
}

message GetWorkflowTimelineResponse {
  repeated AuditEventDTO events = 1;
}

message ApprovalSubmission {
  // show is read-only; approve and deny require the inspected request UID.
  string action = 1;
  string workflow_id = 2;
  string request_uid = 3;
}

message ApprovalResponse {
  bool success = 1;
  string message = 2;
}

message StoreContextSnapshotRequest {
  string namespace = 1;
  string agent_run = 2;
  string agent_run_uid = 3;
  bytes snapshot = 4;
}
message ContextSnapshotReceipt {
  string id = 1;
  string digest = 2;
  string event_id = 3;
}
message GetContextSnapshotRequest { string id = 1; }
message GetContextSnapshotResponse {
  ContextSnapshotReceipt receipt = 1;
  bytes snapshot = 2;
}
message GetWorkflowLineageRequest {
  string workflow_id = 1;
  string event_id = 2;
}
message GetWorkflowLineageResponse { string projection_json = 1; }
