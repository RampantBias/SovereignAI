syntax = "proto3";

package api.v1;
option go_package = "api/v1/pb";

// Define the network service endpoints
service OrchestratorService {
  rpc CreateProject (CreateProjectRequest) returns (CreateProjectResponse);
  rpc CleanWorkflow (CleanWorkflowRequest) returns (CleanWorkflowResponse);
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
}

message CreateProjectRequest {
  string project_name = 1;
  string infra_repo = 2;
  string app_repo = 3;
  
  // The open extension point for enterprise variations
  string strategy_type = 4;                 // e.g., "single-repo", "enterprise-cluster"
  map<string, string> extended_metadata = 5; // e.g., {"terraform_repo": "git://...", "shared_charts": "true"}
}

message CreateProjectResponse {
  bool success = 1;
  string message = 2;
}


message CleanWorkflowRequest {
  string workflow_id = 1;
  string project_name = 2;
}

message CleanWorkflowResponse {
  bool success = 1;
  string message = 2;
}

// CreateWorkflow
message CreateWorkflowRequest {
    string project_name = 1;
    string manifest_content = 2;
}

message CreateWorkflowResponse {
    string workflow_id = 1;
}
//


message ListWorkflowsRequest {
  string project_name = 1;
}

// The clean Data Transfer Object definition
message WorkflowStatusDTO {
  string project_name = 1;
  string workflow_id = 2;
  string status = 3;
  string current_step = 4;
  string namespace = 5;
}

message ListWorkflowsResponse {
  repeated WorkflowStatusDTO workflows = 1; // 'repeated' represents an array/slice in Go
}