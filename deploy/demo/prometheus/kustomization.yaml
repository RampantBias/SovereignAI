apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sovereign-ai-monitoring

resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: prometheus-configuration
    files:
      - prometheus.yml

labels:
  - pairs:
      app.kubernetes.io/part-of: sovereign-ai-demo
      app.kubernetes.io/component: prometheus
