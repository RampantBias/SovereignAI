global:
  scrape_interval: 15s
  scrape_timeout: 10s

storage:
  tsdb:
    retention:
      time: 7d
      size: 8GB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: sovereign-controller
    static_configs:
      - targets:
          - sovereign-controller-metrics.sovereign-orchestrator-system.svc.cluster.local:8081
