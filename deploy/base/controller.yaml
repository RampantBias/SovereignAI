apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-controller
  namespace: sovereign-orchestrator-system
  labels:
    app.kubernetes.io/name: sovereign-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-controller
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      serviceAccountName: sovereign-controller
      containers:
        - name: controller
          image: sovereign-controller:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sovereign-audit-client
          env:
            - name: SOVEREIGN_SYSTEM_NAMESPACE
              value: sovereign-orchestrator-system
            - name: SOVEREIGN_STORAGE_CLASS
              value: local-path
            - name: SOVEREIGN_COLLECTOR_IMAGE
              value: sovereign-artifact-collector:dev
            - name: SOVEREIGN_BOOTSTRAP_IMAGE
              value: sovereign-artifact-bootstrap:dev
            - name: SOVEREIGN_UTILITY_IMAGE
              value: sovereign-utility-runner:dev
            - name: SOVEREIGN_MODEL_ID
              value: cyankiwi/Qwen3.5-9B-AWQ-4bit
            - name: SOVEREIGN_MODEL_REVISION
              value: 156edc4bbeb8d1910ee7be9196bafaf1bc052156
            - name: SOVEREIGN_SERVED_MODEL_NAME
              value: code-qwen35-9b-awq
            - name: SOVEREIGN_VLLM_DTYPE
              value: bfloat16
            - name: SOVEREIGN_VLLM_QUANTIZATION
              value: compressed-tensors
            - name: SOVEREIGN_VLLM_ATTENTION_BACKEND
              value: ""
            - name: SOVEREIGN_VLLM_TOOL_CALL_PARSER
              value: qwen3_coder
            - name: SOVEREIGN_VLLM_REASONING_PARSER
              value: qwen3
            - name: SOVEREIGN_VLLM_LANGUAGE_MODEL_ONLY
              value: "true"
            - name: SOVEREIGN_VLLM_ENABLE_THINKING
              value: "false"
            - name: SOVEREIGN_VLLM_MAX_MODEL_LEN
              value: "16384"
            - name: SOVEREIGN_VLLM_KV_CACHE_MEMORY_BYTES
              value: "3221225472"
            - name: SOVEREIGN_MODEL_VRAM_MIB
              value: "9216"
            - name: SOVEREIGN_KV_VRAM_MIB
              value: "4096"
            - name: SOVEREIGN_VRAM_HEADROOM_MIB
              value: "2048"
            - name: SOVEREIGN_DEV_LOGGING
              value: "true"
          ports:
            - name: metrics
              containerPort: 8081
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
